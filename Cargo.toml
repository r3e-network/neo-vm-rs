[package]
name = "neo-vm-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/r3e-network/neo-vm-rs"
description = "Shared NeoVM semantics for Neo N4 RISC-V and zkVM execution profiles"

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["serde/std"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.11", default-features = false }
