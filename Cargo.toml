[package]
name = "neo-vm-rs"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/r3e-network/neo-vm-rs"
description = "Shared NeoVM semantics for Neo N4 RISC-V and zkVM execution profiles"

[lib]
path = "src/lib.rs"

[features]
# Default = the full VM (both engines), so existing consumers are unaffected.
default = ["std", "interpreter", "runtime"]
std = ["serde/std"]
# The direct `match opcode` dispatch loop — `interpret()`. Used by the standalone
# neo-vm and by riscvm's in-process (PolkaVM guest) execution.
interpreter = []
# The `VmContext` + `RuntimeStack` ABI for straight-line / compiled execution.
# Used by riscvm's NeoVM->Rust->RISC-V compiler and by neo-zkvm's proving backend.
runtime = []

[dependencies]
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
criterion = "0.8"
serde_json = "1.0"

[[bench]]
name = "semantics"
harness = false
